[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vamp-log-hunter"
version = "1.1"
description = "Log hunting and threat-pattern scanner for authorized security assessments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "log-hunting", "threat-hunting", "siem", "blue-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
]


[project.scripts]
vamp-log-hunter = "vamp_log_hunter:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-log-hunter"
Repository = "https://github.com/Vampsecure-Labs/vamp-log-hunter"

[tool.setuptools]
py-modules = ["vamp_log_hunter", "vampsec_report"]
